[project]
name = "auto-answer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "paddleocr>=3.3,<4",
    "paddlepaddle-gpu==3.3.1",
    "pillow>=11,<13",
    "openai>=2.48"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
auto-answer = "auto_answer.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
