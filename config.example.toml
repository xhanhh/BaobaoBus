# The sample values below match res/example-screenshot.jpg (2670x1200).
# For live use, replace them with the scrcpy video rectangle on the Windows desktop.
[capture]
left = 0
top = 0
width = 1500
height = 674

[regions.question_number]
# Tight ROI containing only the "第 X 题" text.
left = 660
top = 25
width = 180
height = 50

[regions.ready_indicator]
# Center strip containing the colored "Ready" / "Go!" text.
left = 560
top = 185
width = 380
height = 130

[regions.question]
# ROI coordinates are relative to the captured scrcpy frame above.
left = 43
top = 100
width = 1300
height = 150

# Option ROIs may be listed in any order. The program assigns indices by visual
# order: rows top-to-bottom, and within each row left-to-right.
[[regions.options]]
left = 277
top = 277
width = 444
height = 85

[[regions.options]]
left = 772
top = 277
width = 444
height = 85

[[regions.options]]
