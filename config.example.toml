[ocr]
language = "ch"
confidence_threshold = 0.60
option_symbol_confidence_threshold = 0.45
use_gpu = true
# PaddleOCR 3.7 + PaddlePaddle 3.3.1 can fail in the oneDNN PIR converter.
# Keep this disabled unless a future verified version fixes that incompatibility.
enable_mkldnn = false
cpu_threads = 8
text_detection_model_name = "PP-OCRv6_medium_det"
text_recognition_model_name = "PP-OCRv6_medium_rec"
isolated_fragment_max_chars = 1
isolated_fragment_max_area_ratio = 0.02
isolated_fragment_max_height_ratio = 0.50
recover_thin_minus = true
symbol_foreground_threshold = 180

[ollama]
base_url = "http://localhost:11434"
model = "qwen3.5:9b"
timeout_seconds = 30.0
keep_alive = "30m"
num_predict = 64
warmup_on_start = true
# If the strict numeric response is empty, invalid, contradictory, or times out,
# retry exactly once using the simpler text/index response format.
retry_numeric_as_text = true

[llm]
# Providers are tried in this order. Disabled providers are skipped.
provider_order = ["aliyun", "ollama"]

[openai_compatible]
# Aliyun Model Studio OpenAI-compatible Chat API.
enabled = false
base_url = "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
# qwen3.7-flash favors latency; qwen3.7-plus favors accuracy.
model = "qwen3.7-flash"
# Copy this file to the gitignored src/config.toml before filling the secret.
api_key = ""
# Optional fallback when api_key above is empty.
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 10.0
enable_thinking = false
retry_numeric_as_text = true

[adb]
executable = "tools/android/adb.exe"
# Set serial when more than one device is connected. Otherwise leave it empty.
serial = ""
timeout_seconds = 5.0
# Reuse one adb shell process for taps; automatically falls back if it disconnects.
persistent_shell = true

# These are PHONE NATIVE SCREEN coordinates, not screenshot/ROI coordinates.
# All four placeholders must be replaced before live mode is allowed to start.
[[adb.tap_points]]
x = 896
y = 585

[[adb.tap_points]]
x = 1770
y = 595

[[adb.tap_points]]
x = 950
y = 776

[[adb.tap_points]]
x = 1800
y = 775

[state]
# Differences are normalized mean grayscale differences in [0, 1].
stable_threshold = 0.025
change_threshold = 0.030
poll_interval_seconds = 0.03
required_stable_frames = 2
stable_timeout_seconds = 8.0
change_timeout_seconds = 8.0
page_confirm_frames = 2
new_question_confirm_frames = 1
page_wait_timeout_seconds = 10.0
transition_timeout_seconds = 12.0
question_number_cache_seconds = 1.0
ocr_retry_attempts = 2
ocr_retry_interval_seconds = 0.10
white_pixel_threshold = 210
min_white_ratio = 0.55
max_capture_failures = 3
# Start OCR one confirmation frame early, then validate against a fresh frame.
overlap_ocr_with_stability = true
# Skip heavyweight title OCR while the white "第 X 题" text is faded out.
title_white_pixel_threshold = 210
title_min_white_ratio = 0.02
# Periodic forced probe prevents a bad visibility threshold from blocking forever.
title_probe_interval_seconds = 0.75
# Poll more frequently after Ready/Go, while the first answer page fades in.
ready_poll_interval_seconds = 0.005
ready_fast_window_seconds = 6.0
ready_confirm_frames = 2
ready_min_text_color_ratio = 0.15
ready_min_purple_ratio = 0.60
# The normal question OCR still verifies "第1题" before any tap.
infer_first_question_number_after_ready = true
# Save one separate title OCR on transitions; batch OCR still verifies the title.
infer_sequential_question_number = true

[post_challenge]
# Disabled by default. The sample ROIs assume a 1500x674 captured scrcpy frame.
enabled = false
success_banner = { left = 400, top = 100, width = 700, height = 120 }
continue_button = { left = 805, top = 485, width = 270, height = 100 }
ranking_panel = { left = 430, top = 90, width = 650, height = 470 }
ranking_close_button = { left = 1060, top = 120, width = 110, height = 100 }
# PHONE-NATIVE coordinates for a 2670x1200 landscape screen.
ranking_close_tap = { x = 1980, y = 300 }
continue_challenge_tap = { x = 1660, y = 960 }
poll_interval_seconds = 0.10
detection_timeout_seconds = 3.0
ranking_popup_wait_seconds = 4.0
ranking_close_timeout_seconds = 10.0
ready_timeout_seconds = 30.0
confirm_frames = 3
max_capture_failures = 3
success_green_ratio = 0.35
failure_blue_ratio = 0.55
continue_orange_ratio = 0.30
popup_banner_pink_ratio = 0.35
popup_panel_pink_ratio = 0.10
popup_panel_white_ratio = 0.30
popup_close_white_ratio = 0.20
popup_close_orange_ratio = 0.03

[debug]
enabled = true
output_dir = "artifacts/failures"
save_each_question = false

[fallback]
# WARNING: enabling either option permits an intentionally unverified tap.
# Keep both false when a human should handle the failed question.
random_on_ocr_failure = false
random_on_llm_failure = false

[runtime]
log_file = "artifacts/auto-answer.log"
# DEBUG shows timing details; INFO is recommended for normal operation.
log_level = "INFO"
